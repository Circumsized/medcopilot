[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medcopilot"
version = "2.0.0"
description = "Med-Copilot: Self-Contained Agentic Medical RAG with Deterministic Clinical Safety Gates"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [
    {name = "ZJUSE AI Camp Contributors"}
]
keywords = ["Medical-RAG", "Agentic-RAG", "Clinical-Safety", "Hybrid-Retrieval", "FastAPI"]

dependencies = [
    "numpy>=1.24.0,<3",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "gradio>=6,<7",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.2,<0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "torch>=2.10.0",
]
ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
]
eval = [
    "ragas>=0.1.0",
    "deepeval>=1.0.0",
]


