[dependency-groups]
build = ["setuptools>=61.0", "wheel"]
supply-chain = ["pip-audit", "cyclonedx-bom"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: heavyweight model-download tests, skipped in CI",
]
testpaths = ["medcopilot/tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["medcopilot"]

[tool.setuptools.packages.find]
where = ["."]
include = ["medcopilot*"]
namespaces = true
exclude = [
    "medcopilot.logs*",
    "medcopilot.outputs*",
    "medcopilot.docs*",
    "medcopilot.tests*",
    "medcopilot.loadtests*",
]
